        - STM32F407xx
        - USE_HAL_DRIVER
      incList:
        - .
        - Core/Inc
        - Debug/Inc
        - Bsp/Inc
        - Sensor/Inc
        - Framework/Inc
        - Business/Inc
        - Display/Inc
        - Storage/Inc
