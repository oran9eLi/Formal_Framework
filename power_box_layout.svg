<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #18212b; }
      .title { font-size: 30px; font-weight: 700; }
      .zone-title { font-size: 22px; font-weight: 700; }
      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 15px; }
      .note { font-size: 15px; fill: #4b5a67; }
      .outer { fill: #fbfbfb; stroke: #101820; stroke-width: 5; rx: 12; }
      .zone-low { fill: #eef8ff; stroke: #1c6ea4; stroke-width: 4; rx: 10; }
      .zone-power { fill: #fff3eb; stroke: #b84a1d; stroke-width: 4; rx: 10; }
      .box { fill: #ffffff; stroke: #17212b; stroke-width: 4; rx: 8; }
      .protect { fill: #fff8d8; stroke: #a87900; stroke-width: 3; rx: 8; }
      .switch { fill: #eaffea; stroke: #2c7a2c; stroke-width: 3; rx: 8; }
      .ground { fill: #eef0f2; stroke: #46515c; stroke-width: 3; rx: 8; }
      .wire12 { stroke: #166ca3; stroke-width: 6; fill: none; marker-end: url(#arrow12); }
      .wire5 { stroke: #2f8f46; stroke-width: 5; fill: none; marker-end: url(#arrow5); }
      .wire33 { stroke: #7d4cc2; stroke-width: 5; fill: none; marker-end: url(#arrow33); }
      .wire-power { stroke: #d4561f; stroke-width: 7; fill: none; marker-end: url(#arrowPower); }
      .wire-ground { stroke: #46515c; stroke-width: 4; fill: none; stroke-dasharray: 10 8; marker-end: url(#arrowGround); }
      .wire-signal { stroke: #8057b7; stroke-width: 3; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowSignal); }
      .tag12 { fill: #166ca3; font-size: 16px; font-weight: 700; }
      .tag5 { fill: #2f8f46; font-size: 16px; font-weight: 700; }
      .tag33 { fill: #7d4cc2; font-size: 16px; font-weight: 700; }
      .tagp { fill: #d4561f; font-size: 16px; font-weight: 700; }
    </style>
    <marker id="arrow12" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#166ca3"/>
    </marker>
    <marker id="arrow5" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2f8f46"/>
    </marker>
    <marker id="arrow33" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7d4cc2"/>
    </marker>
    <marker id="arrowPower" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d4561f"/>
    </marker>
    <marker id="arrowGround" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#46515c"/>
    </marker>
    <marker id="arrowSignal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#8057b7"/>
    </marker>
  </defs>

  <rect x="30" y="25" width="1440" height="800" class="outer"/>
  <text x="60" y="75" class="title">箱子底部电源系统布局</text>
  <text x="60" y="106" class="note">已去掉防反接和急停：12V 只进主板，屏幕由主板供电；5V 只给存储；3.3V 给通信和传感器。</text>

  <rect x="65" y="140" width="800" height="610" class="zone-low"/>
  <text x="95" y="180" class="zone-title" fill="#1c6ea4">低压主控区</text>
  <text x="95" y="207" class="note">主控电池、保险、开关、稳压模块、主板和低压外设集中在左侧。</text>

  <rect x="925" y="140" width="510" height="610" class="zone-power"/>
  <text x="955" y="180" class="zone-title" fill="#b84a1d">动力大电流区</text>
  <text x="955" y="207" class="note">电机电池、动力保险、分电板和电调/电机集中在右侧。</text>

  <rect x="105" y="270" width="145" height="78" class="box"/>
  <text x="128" y="304" class="label">主控电池</text>
  <text x="128" y="329" class="small">2S/3S 锂电</text>

  <rect x="300" y="270" width="115" height="78" class="protect"/>
  <text x="329" y="304" class="label">保险</text>
  <text x="324" y="329" class="small">3A~5A</text>

  <rect x="465" y="270" width="115" height="78" class="switch"/>
  <text x="493" y="304" class="label">开关</text>
  <text x="485" y="329" class="small">主控电源</text>

  <rect x="650" y="235" width="170" height="150" class="box"/>
  <text x="682" y="273" class="label">稳压模块</text>
  <text x="678" y="307" class="small">12V 输出</text>
  <text x="678" y="334" class="small">5V 输出</text>
  <text x="678" y="361" class="small">3.3V 输出</text>

  <rect x="560" y="465" width="240" height="110" class="box"/>
  <text x="647" y="508" class="label">主板</text>
  <text x="622" y="536" class="small">12V 输入</text>
  <text x="604" y="560" class="small">屏幕从主板取电</text>

  <rect x="590" y="645" width="185" height="70" class="box"/>
  <text x="646" y="688" class="label">屏幕</text>

  <rect x="105" y="515" width="145" height="78" class="box"/>
  <text x="157" y="549" class="label">存储</text>
  <text x="160" y="574" class="small">5V</text>

  <rect x="300" y="635" width="190" height="72" class="box"/>
  <text x="330" y="678" class="label">通信/传感器</text>
  <text x="438" y="678" class="small">3.3V</text>

  <rect x="970" y="270" width="150" height="78" class="box"/>
  <text x="996" y="304" class="label">电机电池</text>
  <text x="996" y="329" class="small">XT60/XT90</text>

  <rect x="1170" y="270" width="130" height="78" class="protect"/>
  <text x="1202" y="304" class="label">大保险</text>
  <text x="1198" y="329" class="small">按电流选</text>

  <rect x="1015" y="500" width="215" height="120" class="box"/>
  <text x="1056" y="550" class="label">电机分电板</text>
  <text x="1058" y="580" class="small">PDB / ESC 供电</text>

  <rect x="1265" y="520" width="130" height="80" class="box"/>
  <text x="1287" y="565" class="label">电调/电机</text>

  <rect x="720" y="765" width="180" height="50" class="ground"/>
  <text x="748" y="797" class="label">单点共地</text>

  <path d="M250 309 L300 309" class="wire12"/>
  <path d="M415 309 L465 309" class="wire12"/>
  <path d="M580 309 L650 309" class="wire12"/>
  <text x="596" y="294" class="tag12">电池输入</text>

  <path d="M735 385 L735 430 L680 430 L680 465" class="wire12"/>
  <text x="745" y="424" class="tag12">12V 到主板</text>

  <path d="M650 330 L520 330 L520 554 L250 554" class="wire5"/>
  <text x="432" y="536" class="tag5">5V 只接存储</text>

  <path d="M650 360 L535 360 L535 671 L490 671" class="wire33"/>
  <text x="545" y="651" class="tag33">3.3V</text>

  <path d="M682 575 L682 645" class="wire12"/>
  <text x="696" y="620" class="tag12">主板供屏</text>

  <path d="M1120 309 L1170 309" class="wire-power"/>
  <path d="M1235 348 L1235 450 L1123 450 L1123 500" class="wire-power"/>
  <text x="1248" y="420" class="tagp">动力电源</text>
  <path d="M1230 560 L1265 560" class="wire-power"/>

  <path d="M680 575 L790 765" class="wire-ground"/>
  <path d="M1123 620 L875 765" class="wire-ground"/>
  <text x="830" y="743" class="small" fill="#46515c">主控 GND 与动力 GND 单点连接</text>

  <path d="M800 520 C900 500, 945 525, 1015 560" class="wire-signal"/>
  <text x="850" y="493" class="small" fill="#8057b7">主板到电调控制线</text>

  <rect x="90" y="815" width="1290" height="1" fill="#d4d9de"/>
  <text x="115" y="838" class="small">建议走线：蓝色 12V、绿色 5V、紫色 3.3V、橙色动力电源、灰色共地、虚线紫色控制信号。</text>
</svg>
